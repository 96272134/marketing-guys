<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Organic Cyan/Mint Clouds -->
  <path d="M 52 14 C 66 14 78 20 80 34 C 88 36 92 44 90 52 C 92 64 84 74 72 76 C 65 83 48 83 40 80 C 26 82 14 74 12 63 C 6 55 10 43 18 39 C 18 25 32 14 52 14 Z" fill="#BAF7E8" />
  
  <!-- Pixel / Sparkle Accents in turquoise -->
  <rect x="58" y="17" width="5" height="1.8" rx="0.9" fill="#4ED9BC" />
  <rect x="67" y="21" width="7" height="1.8" rx="0.9" fill="#4ED9BC" />
  <rect x="14" y="47" width="4.5" height="1.8" rx="0.9" fill="#4ED9BC" />
  <rect x="18" y="51" width="6.5" height="1.8" rx="0.9" fill="#4ED9BC" />

  <!-- Monitor Stand Base -->
  <path d="M 41 74.5 L 43 72.5 H 67 L 69 74.5 H 41 Z" fill="#C5CAC0" stroke="#37312A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 48 64 L 46 72.5 H 64 L 62 64" fill="#D7DCD2" stroke="#37312A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Monitor Outer Body (Beige/Off-White Bezel with Rounded Corners) -->
  <rect x="27" y="27" width="55" height="37" rx="5" fill="#E8F9FD" stroke="#37312A" stroke-width="2" />

  <!-- Monitor Screen (Cyan/Teal Gradient/Solid Fill) -->
  <rect x="30" y="30" width="49" height="25" rx="2" fill="#C0F1FC" stroke="#37312A" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Left Screen Highlight Lines -->
  <line x1="32.5" y1="34" x2="32.5" y2="43" stroke="#37312A" stroke-width="1.4" stroke-linecap="round" />
  <line x1="32.5" y1="46" x2="32.5" y2="48.5" stroke="#37312A" stroke-width="1.4" stroke-linecap="round" />

  <!-- Monitor Lower Chin / Bar with Webcam Center Dot -->
  <path d="M 27 55 H 82 V 59 C 82 61.8 79.8 64 77 64 H 32 C 29.2 64 27 61.8 27 59 Z" fill="#F4F3EE" stroke="#37312A" stroke-width="2" />
  <circle cx="54.5" cy="59.5" r="1.5" fill="none" stroke="#37312A" stroke-width="1.4" />

  <!-- Center Gear (Lilac / Soft Violet) -->
  <g transform="translate(54.5, 42.5)">
    <!-- 8 Tooth Cog -->
    <path d="
      M -3 -12.5 H 3 L 4 -9.5 C 5.6 -8.9 7.1 -7.9 8.3 -6.7 L 11.2 -7.7 L 14.8 -3.8 L 13 -1.2 C 13.3 0.3 13.3 1.9 13 3.4 L 14.8 6 L 11.2 9.9 L 8.3 8.9 C 7.1 10.1 5.6 11.1 4 11.7 L 3 14.7 H -3 L -4 11.7 C -5.6 11.1 -7.1 10.1 -8.3 8.9 L -11.2 9.9 L -14.8 6 L -13 3.4 C -13.3 1.9 -13.3 0.3 -13 -1.2 L -14.8 -3.8 L -11.2 -7.7 L -8.3 -6.7 C -7.1 -7.9 -5.6 -8.9 -4 -9.5 Z
    " fill="#C0B7ED" stroke="#37312A" stroke-width="1.8" stroke-linejoin="round" />
    <!-- Gear Axle Center Hole -->
    <circle cx="0" cy="1.1" r="4.2" fill="#E8F9FD" stroke="#37312A" stroke-width="1.8" />
  </g>

  <!-- Foreground Cloud Layer (Soft Cream with dark outline) -->
  <path d="
    M 28 71
    C 20 71 14 65.5 14 58.5
    C 14 52.5 18 47.5 24 46.5
    C 26 40.5 32 36 39 36
    C 46 36 52 40 54 45.5
    C 58 45.5 62 49 62 54
    C 62 60 57 65 51 65.5
    L 49 71
    Z
  " fill="#FFFCF3" stroke="#37312A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Cloud Interior Detail Arcs -->
  <path d="M 20 62 C 22 58.5 26 56.5 30 57.5" stroke="#DDD7BF" stroke-width="1.4" stroke-linecap="round" fill="none" />
  <path d="M 32 48 C 36 43.5 43 44 46 48" stroke="#DDD7BF" stroke-width="1.4" stroke-linecap="round" fill="none" />
  
  <!-- Cloud Bottom Border Line -->
  <line x1="32" y1="71" x2="49" y2="71" stroke="#37312A" stroke-width="2" stroke-linecap="round" />
</svg>
